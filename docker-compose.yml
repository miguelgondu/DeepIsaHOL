version: '3.8'

services:
  deepisahol:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which Isabelle library sessions get prebuilt into the `Benchmark`
        # heap. Defaults to the cheapest possible heap (bare HOL, seconds to
        # build). See README.md ("Configuring which Isabelle libraries are
        # built") for the full session list and a worked example reproducing
        # the old always-on Analysis/Probability set.
        DEEPISAHOL_PARENT_SESSION: ${DEEPISAHOL_PARENT_SESSION:-HOL}
        DEEPISAHOL_EXTRA_SESSIONS: ${DEEPISAHOL_EXTRA_SESSIONS:-}
        # Benchmark heap-build parallelism (only matters once the config
        # above is non-trivial). Empty THREADS => auto (all CPUs the
        # build sees, capped by RAM). Override, e.g.
        # BENCHMARK_THREADS=6 BENCHMARK_JOBS=2 docker compose build deepisahol
        BENCHMARK_THREADS: ${BENCHMARK_THREADS:-}
        BENCHMARK_JOBS: ${BENCHMARK_JOBS:-1}
    platform: linux/amd64
    container_name: deepisahol-api
    ports:
      - "8000:8000"
    environment:
      - PY4J_PORT=25333
      - API_PORT=8000
      - STARTUP_WAIT=30
      # Max concurrent `isabelle build` calls. Kept low relative to the
      # memory limits below — each build maps the full Benchmark heap into
      # its own process, so too much concurrency risks the OOM killer.
      - BUILD_MAX_WORKERS=${BUILD_MAX_WORKERS:-2}
    # Memory limits - Isabelle requires significant memory
    # Minimum: 8GB, Recommended: 16GB
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
    # Health check with extended start period for Isabelle initialization
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Restart policy
    restart: unless-stopped
    # Optional: mount custom theories directory
    # volumes:
    #   - ./theories:/app/theories:ro
